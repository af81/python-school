site_name: Modul 319 – Programmieren Grundlagen in Python
site_description: Unterrichtsmaterial für das Modul 319 an der BBZW Sursee
site_author: Dr. Andreas Fischer
site_url: https://af81.github.io/python-school/
copyright: Copyright &copy; 2025 Dr. Andreas Fischer
plugins:
  - search
  - mermaid2
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
theme:
  name: material
  logo: img/python-logo.png
  language: de
  features:
    - navigation.instant
    - navigation.tracking
    - toc.integrate
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.share
  palette:
    - scheme: default
      primary: light-blue
      accent: pink
      toggle:
        icon: material/weather-night
        name: Dunkelmodus
    - scheme: slate
      primary: light-blue
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Hellmodus
nav:
  - Startseite: index.md
  - Semesterplan: semesterplan.md
  - Theorie:
      - Grundlagen Programmierung: theorie/computer-programm.md
      - Git und GitHub: theorie/git.md
      - "Python Basics":
        - Einführung in Python: theorie/firstprogram.md
        - Variablen & Datentypen: theorie/variablen.md
        - Rechnen: theorie/rechnen.md
        - Operatoren: theorie/operatoren.md
        - Kontrollstrukturen: theorie/kontrollstrukturen.md
        - Listen & Tuples: theorie/lists.md
        - Funktionen: theorie/funktionen.md
        # - Dictionaries: theorie/python-dictionaries.md
        # - Dateien: theorie/python-dateien.md
        # - Fehler und Ausnahmen: theorie/python-fehler.md
        # - Klassen und Objekte: theorie/python-klassen.md
  - Aufgaben:
      - "Setup & Begriffe":
        - VS Code & Python: aufgaben/vscode-setup.md
        - Git & GitHub: aufgaben/git-setup.md
        - Hello World!: aufgaben/hellowoworld.md
        - Wichtige Begriffe lernen: aufgaben/begriffe.md
      - "Git & GitHub":
        - Das erste Repository: aufgaben/git.md
        - Änderungen nachvollziehen: aufgaben/git-commit.md
        - Änderungen rückgängig machen: aufgaben/git-change.md
        - Github-Repos verbinden: aufgaben/github.md
        - Github im Team nutzen: aufgaben/github-team.md
      - "Python Basics":
        - Repo einrichten: aufgaben/python-repo.md
        - Block 1: aufgaben/block_1.md
        - Block 2: aufgaben/block_2.md
        - Block 3: aufgaben/block_3.md
        - Block 4: aufgaben/block_4.md
  - Klassenregeln: regeln.md
  - Ressourcen:
      - Wichtige Terminal-Befehle: ressourcen/terminal.md
      - Nützliche Links: ressourcen/links.md
      - Probeprüfung: test.md
